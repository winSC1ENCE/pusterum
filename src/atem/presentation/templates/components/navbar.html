<header class="sticky top-0 z-50 bg-theme-main/90 backdrop-blur-md border-b border-theme transition-colors duration-300" x-data="{ mobileOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <!-- Brand / Logo -->
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-11 h-11 rounded-full bg-theme-secondary/40 flex items-center justify-center p-2 border border-theme group-hover:scale-105 transition-transform duration-300" style="width: 44px; height: 44px;">
                    <img src="/static/images/favicon.svg" alt="Atemtherapie Logo" class="w-full h-full object-contain" width="28" height="28" />
                </div>
                <div>
                    <span class="font-heading text-xl sm:text-2xl font-bold tracking-tight text-theme-primary block leading-tight">
                        Atem &amp; Raum
                    </span>
                    <span class="text-xs uppercase tracking-wider text-theme-text-muted block">
                        Komplementärtherapie OdA KT
                    </span>
                </div>
            </a>

            <!-- Desktop Navigation -->
            <nav class="hidden md:flex items-center gap-7 text-sm font-medium text-theme-text-main">
                <a href="/#start" class="hover:text-theme-primary transition-colors py-1">Start</a>
                <a href="/#ueber-mich" class="hover:text-theme-primary transition-colors py-1">Über mich</a>
                <a href="/#kompetenzen" class="hover:text-theme-primary transition-colors py-1">Kompetenzen</a>
                <a href="/#angebote" class="hover:text-theme-primary transition-colors py-1">Angebote &amp; Kosten</a>
                <a href="/#praxis" class="hover:text-theme-primary transition-colors py-1">Praxis</a>
                <a href="/#kontakt" class="hover:text-theme-primary transition-colors py-1">Kontakt</a>

                <a href="/#kontakt" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-theme-primary text-white hover-bg-theme-primary transition-all duration-300 shadow-sm hover:shadow text-sm font-medium">
                    <span>Termin anfragen</span>
                    <svg class="w-4 h-4" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </a>
            </nav>

            <!-- Mobile Menu Toggle Button -->
            <div class="flex items-center md:hidden">
                <button 
                    @click="mobileOpen = !mobileOpen" 
                    type="button" 
                    class="p-2 rounded-lg text-theme-text-main hover:bg-theme-secondary/30 transition-colors focus:outline-none"
                    aria-label="Menü öffnen"
                >
                    <svg x-show="!mobileOpen" class="w-6 h-6" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    <svg x-show="mobileOpen" x-cloak class="w-6 h-6" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div 
        x-show="mobileOpen" 
        x-cloak
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 -translate-y-2"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 -translate-y-2"
        class="md:hidden border-b border-theme bg-theme-main px-4 pt-3 pb-6 space-y-3 shadow-lg"
    >
        <a @click="mobileOpen = false" href="/#start" class="block px-3 py-2 rounded-lg text-base font-medium hover:bg-theme-secondary/30 text-theme-text-main">Start</a>
        <a @click="mobileOpen = false" href="/#ueber-mich" class="block px-3 py-2 rounded-lg text-base font-medium hover:bg-theme-secondary/30 text-theme-text-main">Über mich</a>
        <a @click="mobileOpen = false" href="/#kompetenzen" class="block px-3 py-2 rounded-lg text-base font-medium hover:bg-theme-secondary/30 text-theme-text-main">Kompetenzen</a>
        <a @click="mobileOpen = false" href="/#angebote" class="block px-3 py-2 rounded-lg text-base font-medium hover:bg-theme-secondary/30 text-theme-text-main">Angebote &amp; Kosten</a>
        <a @click="mobileOpen = false" href="/#praxis" class="block px-3 py-2 rounded-lg text-base font-medium hover:bg-theme-secondary/30 text-theme-text-main">Praxis</a>
        <a @click="mobileOpen = false" href="/#kontakt" class="block px-3 py-2 rounded-lg text-base font-medium hover:bg-theme-secondary/30 text-theme-text-main">Kontakt</a>
        <div class="pt-2">
            <a @click="mobileOpen = false" href="/#kontakt" class="block text-center w-full px-5 py-3 rounded-full bg-theme-primary text-white hover-bg-theme-primary font-medium shadow">
                Termin anfragen
            </a>
        </div>
    </div>
</header>
