# fail2ban jails for the PUSTERUM server (copy to /etc/fail2ban/jail.d/)
[DEFAULT]
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
findtime = 15m

[sshd]
enabled = true
mode = aggressive
maxretry = 4

# Repeated failed admin logins → ban the IP in front of the Docker containers.
# Docker-published ports bypass the INPUT chain, therefore the DOCKER-USER chain is used.
[pusterum-admin]
enabled = true
filter = pusterum-admin
logpath = /var/lib/docker/containers/*/*-json.log
backend = polling
maxretry = 8
banaction = iptables-allports[chain="DOCKER-USER"]
