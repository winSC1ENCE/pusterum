<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Praxis für Atemtherapie | Dipl. Komplementärtherapeutin{% endblock %}</title>
    <meta name="description" content="Atemtherapie & Komplementärtherapie OdA KT. Sanfte und wirksame Begleitung bei Stress, Erschöpfung, Atemwegsbeschwerden und für mehr innere Ruhe.">
    <meta name="keywords" content="Atemtherapie, Komplementärtherapie, Krankenkassen anerkannt, EMR, ASCA, OdA KT, Entspannung, Achtsamkeit, Zürich">

    <!-- OpenGraph / Social Meta -->
    <meta property="og:title" content="Praxis für Atemtherapie">
    <meta property="og:description" content="Raum für Atem, Achtsamkeit und heilsame Entlastung.">
    <meta property="og:type" content="website">

    <!-- Fonts: Inter & Playfair Display for calm & elegant medical/wellness feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN (v3.4) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    },
                    colors: {
                        sage: {
                            50: '#f4f7f5',
                            100: '#e5ede8',
                            200: '#cedecf',
                            300: '#a7c4ab',
                            400: '#7fa485',
                            500: '#5f8766',
                            600: '#4a6c50',
                            700: '#3c5641',
                            800: '#324636',
                            900: '#2a3b2e',
                        },
                        sand: {
                            50: '#faf8f5',
                            100: '#f3efe8',
                            200: '#e6ded1',
                            300: '#d5c7b3',
                            400: '#bfab91',
                            500: '#aa9275',
                            600: '#957c61',
                            700: '#7c654f',
                            800: '#665342',
                            900: '#544437',
                        }
                    }
                }
            }
        }
    </script>

    <!-- HTMX & Alpine.js -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.0/dist/cdn.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-sand-50 text-slate-700 font-sans antialiased selection:bg-sage-200 selection:text-sage-900 flex flex-col min-h-screen">

    <!-- Navigation Bar -->
    {% include "components/navbar.html" %}

    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include "components/footer.html" %}

    <!-- Scripts -->
    <script src="/static/js/app.js"></script>
</body>
</html>
