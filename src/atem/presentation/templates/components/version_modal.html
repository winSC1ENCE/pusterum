<!-- =======================================================================
     AUDIT TRAIL & VERSION HISTORY MODAL (ADR-0002)
     Opens when an administrator clicks on a block's version badge (v1, v2, etc.).
     ======================================================================= -->
<div
    id="version-history-modal"
    x-data="{ open: false }"
    x-show="open"
    @open-history-modal.window="open = true"
    @close-history-modal.window="open = false"
    @keydown.escape.window="open = false"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity"
    x-cloak
>
    <!-- Modal Backdrop Click Closes -->
    <div class="fixed inset-0" @click="open = false"></div>

    <div class="relative bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-2xl w-full p-6 sm:p-8 space-y-5 z-10">
        <!-- Header Bar -->
        <div class="flex justify-between items-center border-b border-slate-100 pb-4">
            <div>
                <span class="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Audit Trail &amp; Revisionssicherheit</span>
                <h3 class="text-xl font-bold text-slate-900 mt-0.5">Versionsverlauf &amp; Wiederherstellung</h3>
            </div>
            <button
                type="button"
                @click="open = false"
                class="p-2 rounded-full text-slate-400 hover:text-slate-800 hover:bg-slate-100 transition-colors focus:outline-none"
                aria-label="Schliessen"
            >
                <svg class="w-5 h-5" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Dynamic Content injected via HTMX -->
        <div id="version-history-modal-content" class="space-y-4 max-h-[65vh] overflow-y-auto pr-1">
            <div class="p-8 text-center text-slate-400 text-sm">
                <svg class="w-6 h-6 animate-spin mx-auto mb-2 text-slate-600" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                Lade Versionshistorie...
            </div>
        </div>
    </div>
</div>
