name: CI / Quality & Security Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Weekly run on main: new CVEs (pip-audit, Trivy) show up even without a push
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned by commit SHA (tag in the comment); Dependabot keeps them
# current. Postgres service images must match docker/backup/Dockerfile
# (tests/test_image_pins.py, scripts/sync-image-pins.sh).
env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.12"

jobs:
  code-quality:
    name: Lint, Types, Security & Licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen

      - name: Gitleaks secret scan (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ruff lint
        run: uv run ruff check src tests tests_e2e migrations
      - name: Ruff format
        run: uv run ruff format --check src tests tests_e2e migrations
      - name: Mypy (strict)
        run: uv run mypy src
      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src
      - name: Deptry
        run: uv run deptry .
      - name: Vulture
        run: uv run vulture src

      # Release PR develop → main: new SemVer version with a CHANGELOG.md section (TDR-0009)
      - name: Release version not yet tagged
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          version="$(scripts/release-notes.sh --version)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error file=pyproject.toml::v$version is already released – bump [project].version and move the CHANGELOG.md entries from «Unreleased» to «## [x.y.z] – date» (TDR-0009)"
            exit 1
          fi
          scripts/release-notes.sh "$version" >/dev/null
          echo "Release v$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Export production requirements
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt
      - name: Dependency vulnerability audit (pip-audit)
        run: uv run pip-audit -r requirements.txt --disable-pip --no-deps --progress-spinner off
      - name: Licence compatibility (MIT)
        run: uv run licensecheck --requirements-paths requirements.txt --license MIT --show-only-failing --zero

  tests:
    name: Pytest (${{ matrix.database }})
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: atem
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: atem_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atem -d atem_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://atem:ci-password@localhost:5432/atem_test' || '' }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then unset TEST_DATABASE_URL; fi
          uv run pytest

  migrations:
    name: Alembic migrations (PostgreSQL)
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: atem
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: atem_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atem -d atem_migrations" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://atem:ci-password@localhost:5432/atem_migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: Upgrade empty database to head
        run: uv run alembic upgrade head
      - name: Models and migrations are in sync
        run: uv run alembic check
      - name: Downgrade to base and upgrade again (reversibility)
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Seed content via CLI
        run: uv run python -m atem.cli seed-content

  e2e:
    name: Browser E2E (Playwright, strict CSP)
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: atem
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: atem_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atem -d atem_e2e" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://atem:ci-password@localhost:5432/atem_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: Compile Tailwind CSS
        run: scripts/build-css.sh
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run E2E tests
        run: uv run pytest tests_e2e --no-cov

  docker:
    name: Images, vulnerability scan & smoke start
    runs-on: ubuntu-latest
    needs: [tests, migrations]
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: atem
          POSTGRES_PASSWORD: ci-smoke-password-123
          POSTGRES_DB: atem_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atem -d atem_db" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: pusterum/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Own cache scopes: the Caddy Go build (~100 module downloads) only reruns when its
      # Dockerfile changes – fewer chances for a flaky download to fail a release.
      - name: Build Caddy image (rate limiting)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/caddy
          load: true
          tags: pusterum/caddy:ci
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max
      - name: Build backup image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/backup
          load: true
          tags: pusterum/backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

      - name: Trivy vulnerability scan (app image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pusterum/app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke start in production mode
        run: |
          docker run -d --name app --network host \
            -e ENVIRONMENT=production \
            -e SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            -e ALLOWED_HOSTS='["ci.pusterum.test", "localhost"]' \
            -e DATABASE_URL=postgresql+asyncpg://atem:ci-smoke-password-123@localhost:5432/atem_db \
            -e MAIL_ENABLED=false \
            pusterum/app:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health/ready && break
            sleep 2
          done
          curl -fsS -H "Host: ci.pusterum.test" http://127.0.0.1:8000/ | grep -q PUSTERUM
          curl -fsS -D - -o /dev/null -H "Host: ci.pusterum.test" http://127.0.0.1:8000/ \
            | grep -qi "content-security-policy: default-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: ci.pusterum.test' http://127.0.0.1:8000/schema)" = "404"
      - name: Container logs
        if: always()
        run: docker logs app || true

      - name: Production refuses insecure configuration
        run: |
          if docker run --rm -e ENVIRONMENT=production pusterum/app:ci \
               python -c "from atem.infrastructure.config.settings import get_settings; get_settings()"; then
            echo "expected startup refusal" && exit 1
          fi

  # Pull-based deployment (ADR-0005): after a fully green run on main, move the branch
  # `production` to the tested commit. The server's systemd timer picks it up – no secrets
  # or SSH access from GitHub to the server.
  promote:
    name: Promote to production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [code-quality, tests, migrations, e2e, docker]
    permissions:
      contents: write
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fast-forward production to the tested commit
        run: |
          if git fetch origin production 2>/dev/null; then
            if ! git merge-base --is-ancestor origin/production "$GITHUB_SHA"; then
              echo "production is not an ancestor of $GITHUB_SHA – refusing to rewrite it" && exit 1
            fi
          fi
          git push origin "$GITHUB_SHA:refs/heads/production"
          echo "production → ${GITHUB_SHA::7} (server deploys within ~5 min)" >> "$GITHUB_STEP_SUMMARY"
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(scripts/release-notes.sh --version)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::warning::v$version already exists – no new release (version not bumped)"
            exit 0
          fi
          scripts/release-notes.sh "$version" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$version" --target "$GITHUB_SHA" --title "PUSTERUM v$version" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Release v$version → ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
