<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Atemtherapie – Praxis für Komplementärtherapie OdA KT{% endblock %}</title>

    <!-- Meta Descriptions & SEO -->
    <meta name="description" content="{% block meta_description %}Atemtherapie OdA KT – Sanfte Körper- und Atemarbeit zur Linderung von Stress, Atemnot, Schmerzen und zur Förderung innerer Ruhe. Krankenkassen-anerkannt (EMR/ASCA).{% endblock %}">
    <meta name="keywords" content="Atemtherapie, Komplementärtherapie OdA KT, Atemtherapeutin, EMR anerkannt, ASCA, Stressbewältigung, Long Covid, Achtsamkeit, Schweiz">
    <meta name="author" content="Dipl. Atemtherapeutin OdA KT">

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon.png">

    <!-- Google Webfonts (Playfair, Lora, Plus Jakarta Sans, Rubik) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..600&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN / Local Custom) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            primary: 'var(--theme-primary, #4A6C50)',
                            'primary-hover': 'var(--theme-primary-hover, #3C5641)',
                            secondary: 'var(--theme-secondary, #CEDECF)',
                            accent: 'var(--theme-accent, #7FA485)',
                            bg: 'var(--theme-bg, #FAF8F5)',
                            surface: 'var(--theme-surface, #FFFFFF)',
                            'surface-muted': 'var(--theme-surface-muted, #F3EFE8)',
                            'text-main': 'var(--theme-text-main, #1E293B)',
                            'text-muted': 'var(--theme-text-muted, #64748B)',
                            border: 'var(--theme-border, #E6DED1)',
                        }
                    },
                    fontFamily: {
                        heading: ['var(--font-heading, Lora)', 'serif'],
                        body: ['var(--font-body, Plus Jakarta Sans)', 'sans-serif'],
                    },
                    borderRadius: {
                        'organic': 'var(--theme-shape-radius, 42% 58% 70% 30% / 45% 45% 55% 55%)',
                        'pebble': '60% 40% 30% 70% / 60% 30% 70% 40%',
                        'capsule': '2rem 6rem 2rem 6rem',
                    },
                    animation: {
                        'pulse-slow': 'pulse-slow 8s ease-in-out infinite',
                        'float-slow': 'float-slow 12s ease-in-out infinite',
                        'float-medium': 'float-medium 9s ease-in-out infinite',
                        'float-reverse': 'float-reverse 11s ease-in-out infinite',
                        'breath': 'breath 6s ease-in-out infinite',
                    },
                    keyframes: {
                        'pulse-slow': {
                            '0%, 100%': { transform: 'scale(1) rotate(6deg)', opacity: '0.35' },
                            '50%': { transform: 'scale(1.04) rotate(4deg)', opacity: '0.45' },
                        },
                        'float-slow': {
                            '0%, 100%': { transform: 'translate(0, 0) rotate(-12deg)' },
                            '50%': { transform: 'translate(15px, -25px) rotate(-4deg)' },
                        },
                        'float-medium': {
                            '0%, 100%': { transform: 'translate(0, 0) rotate(25deg)' },
                            '50%': { transform: 'translate(-20px, -30px) rotate(15deg)' },
                        },
                        'float-reverse': {
                            '0%, 100%': { transform: 'translate(0, 0) rotate(45deg)' },
                            '50%': { transform: 'translate(25px, 20px) rotate(35deg)' },
                        },
                        'breath': {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.03)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Dynamic Corporate Design Variables -->
    <style id="dynamic-corporate-design">
        {{ theme_css | safe }}

        body {
            background-color: var(--theme-bg, #FAF8F5);
            color: var(--theme-text-main, #1E293B);
            font-family: var(--font-body, 'Plus Jakarta Sans'), sans-serif;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: var(--font-heading, 'Lora'), serif;
        }

        .shape-organic {
            border-radius: var(--theme-shape-radius, 42% 58% 70% 30% / 45% 45% 55% 55%);
            transition: border-radius 0.6s ease;
        }

        .bg-theme-main {
            background-color: var(--theme-bg, #FAF8F5);
        }

        .bg-theme-card {
            background-color: var(--theme-surface, #FFFFFF);
        }

        .bg-theme-muted {
            background-color: var(--theme-surface-muted, #F3EFE8);
        }

        .text-theme-primary {
            color: var(--theme-primary, #4A6C50);
        }

        .bg-theme-primary {
            background-color: var(--theme-primary, #4A6C50);
        }

        .hover-bg-theme-primary:hover {
            background-color: var(--theme-primary-hover, #3C5641);
        }

        .border-theme {
            border-color: var(--theme-border, #E6DED1);
        }
    </style>

    <link rel="stylesheet" href="/static/css/styles.css">

    <!-- HTMX & Alpine.js -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-theme-secondary selection:text-theme-primary overflow-x-hidden">

    <!-- Navigation Header -->
    {% include "components/navbar.html" %}

    <!-- Main Content Container -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include "components/footer.html" %}

    <!-- Custom Scripts -->
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
