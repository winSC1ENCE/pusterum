{% extends "layouts/base.html" %}

{% block title %}Praxis-Login | Atemtherapie Administration{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-24 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl border border-sand-200 shadow-xl">
        <div class="text-center">
            <div class="w-12 h-12 rounded-full bg-sage-100 text-sage-700 flex items-center justify-center mx-auto mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h2 class="font-serif text-2xl font-medium text-slate-900">Praxis Administration</h2>
            <p class="text-xs text-slate-500 mt-1">Anmeldung für Inhalts- und Anfragenverwaltung</p>
        </div>

        {% if error %}
        <div class="p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/admin/login" class="space-y-6">
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2">Benutzername</label>
                <input type="text" id="username" name="username" required value="{{ username or '' }}"
                       class="w-full px-4 py-3 rounded-xl border border-sand-200 focus:border-sage-500 focus:ring-2 focus:ring-sage-200 text-slate-800 bg-sand-50/40 text-sm">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2">Passwort</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-3 rounded-xl border border-sand-200 focus:border-sage-500 focus:ring-2 focus:ring-sage-200 text-slate-800 bg-sand-50/40 text-sm">
            </div>

            <button type="submit" class="w-full py-3.5 px-4 rounded-full text-white bg-sage-600 hover:bg-sage-700 font-medium shadow-md transition-all">
                Anmelden
            </button>
        </form>
    </div>
</div>
{% endblock %}
