<!-- Pusteblumen-Motiv (Dandelion Breath & Floating Seeds) -->

    <!-- Main Dandelion Hero Graphic (Top Right / Center Floating) -->
    <div class="absolute -right-12 sm:right-4 md:right-12 top-10 sm:top-16 opacity-30 md:opacity-40 max-w-[280px] sm:max-w-[380px] md:max-w-[460px] transform rotate-6 select-none transition-all duration-700">
        <img src="/static/images/dandelion_hero.png" alt="" class="w-full h-auto filter drop-shadow-sm animate-pulse-slow" />

    <div class="absolute left-[45%] top-[15%] opacity-40 max-w-[32px] sm:max-w-[48px] animate-float-medium select-none">

    <!-- Floating Seed Parachute 3 (Right high drift) -->
    <div class="absolute right-[25%] top-[60%] opacity-25 max-w-[36px] sm:max-w-[50px] animate-float-reverse select-none">

    <!-- Floating Seed Parachute 4 (Bottom subtle drift) -->
    <div class="absolute left-[20%] top-[75%] opacity-20 max-w-[28px] sm:max-w-[40px] animate-float-slow select-none">
