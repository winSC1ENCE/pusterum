<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Subtle circular glow -->
    <circle cx="32" cy="32" r="30" fill="#CEDECF" fill-opacity="0.35"/>
    <circle cx="32" cy="32" r="28" stroke="#4A6C50" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Dandelion Stem -->
    <path d="M32 54 C32 42, 32 32, 32 26" stroke="#4A6C50" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Dandelion Center -->
    <circle cx="32" cy="26" r="3" fill="#4A6C50"/>

    <!-- Dandelion Parachutes / Seeds spreading outward -->
    <!-- Center rays -->
    <line x1="32" y1="26" x2="32" y2="12" stroke="#4A6C50" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="32" cy="11" r="1.5" fill="#7FA485"/>

    <!-- Top Right rays -->
    <line x1="32" y1="26" x2="42" y2="15" stroke="#4A6C50" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="43" cy="14" r="1.5" fill="#7FA485"/>

    <line x1="32" y1="26" x2="47" y2="23" stroke="#4A6C50" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="48" cy="23" r="1.5" fill="#7FA485"/>

    <!-- Top Left rays -->
    <line x1="32" y1="26" x2="22" y2="15" stroke="#4A6C50" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="21" cy="14" r="1.5" fill="#7FA485"/>

    <line x1="32" y1="26" x2="17" y2="23" stroke="#4A6C50" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="16" cy="23" r="1.5" fill="#7FA485"/>

    <!-- Floating seeds flying into wind -->
    <!-- Seed 1 (high flying) -->
    <g transform="translate(44, 8) rotate(25)">
        <path d="M0,8 L0,2 M-3,0 L0,2 L3,0 M-2,-2 L0,2 L2,-2" stroke="#4A6C50" stroke-width="1.2" stroke-linecap="round"/>
        <circle cx="0" cy="8" r="1" fill="#4A6C50"/>
    </g>

    <!-- Seed 2 (drifting) -->
    <g transform="translate(50, 18) rotate(40)">
        <path d="M0,6 L0,1 M-2,-1 L0,1 L2,-1" stroke="#7FA485" stroke-width="1" stroke-linecap="round"/>
        <circle cx="0" cy="6" r="0.8" fill="#4A6C50"/>
    </g>
</svg>
