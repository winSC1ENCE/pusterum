<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <!-- Center Receptacle & Core -->
    <circle cx="48" cy="52" r="5" fill="currentColor"/>
    <circle cx="48" cy="52" r="8" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/>

    <!-- Stem with graceful natural curve -->
    <path d="M48 55 Q 47 75 42 94" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Small delicate leaf accent -->
    <path d="M45 78 Q 36 74 38 68 Q 44 71 46 76" fill="currentColor" opacity="0.8"/>

    <!-- Radiating Dandelion Florets (Filaments + Parachute Tips) -->
    <!-- Top & Left florets (intact head) -->
    <!-- -90 deg (Up) -->
    <line x1="48" y1="52" x2="48" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M44 14 L48 18 L52 14 M42 16 L48 18 L54 16 M48 12 L48 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

    <!-- -70 deg -->
    <line x1="48" y1="52" x2="36" y2="20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M32 17 L36 20 L38 15 M30 20 L36 20 L40 17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

    <!-- -110 deg -->
    <line x1="48" y1="52" x2="25" y2="28" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M20 27 L25 28 L25 22 M21 31 L25 28 L28 24" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

    <!-- -140 deg (Left upper) -->
    <line x1="48" y1="52" x2="18" y2="40" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M13 41 L18 40 L16 34 M14 45 L18 40 L19 36" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

    <!-- -170 deg (Left mid) -->
    <line x1="48" y1="52" x2="16" y2="54" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M11 57 L16 54 L12 50 M12 61 L16 54 L14 48" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

    <!-- -195 deg (Left lower) -->
    <line x1="48" y1="52" x2="22" y2="68" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M18 73 L22 68 L17 65" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

    <!-- -225 deg (Lower left) -->
    <line x1="48" y1="52" x2="34" y2="76" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M32 82 L34 76 L28 75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Right side intact florets -->
    <!-- -45 deg -->
    <line x1="48" y1="52" x2="63" y2="26" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M62 20 L63 26 L68 22 M65 19 L63 26 L69 25" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

    <!-- 0 deg (Right mid) -->
    <line x1="48" y1="52" x2="72" y2="50" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M78 48 L72 50 L77 55 M80 51 L72 50 L76 45" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

    <!-- 30 deg (Lower right) -->
    <line x1="48" y1="52" x2="66" y2="68" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M72 71 L66 68 L70 63" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Intermediate rays for lushness -->
    <line x1="48" y1="52" x2="42" y2="30" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="42" cy="30" r="1.5" fill="currentColor"/>

    <line x1="48" y1="52" x2="28" y2="44" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="28" cy="44" r="1.5" fill="currentColor"/>

    <line x1="48" y1="52" x2="58" y2="40" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="58" cy="40" r="1.5" fill="currentColor"/>

    <line x1="48" y1="52" x2="38" y2="62" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="38" cy="62" r="1.5" fill="currentColor"/>

    <!-- ================================================================= -->
    <!-- DETACHED FLOATING SEEDS (Symbolizing "Hā" - Breath & Life Energy) -->
    <!-- ================================================================= -->
    <!-- Seed 1 (Top right high) -->
    <g transform="translate(14, -8) rotate(18 68 22)">
        <line x1="68" y1="28" x2="78" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="68" cy="28" rx="1.5" ry="3" fill="currentColor" transform="rotate(-30 68 28)"/>
        <!-- Parachute plume -->
        <path d="M73 8 L78 12 L84 9 M76 7 L78 12 L82 7 M78 6 L78 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Seed 2 (Far right mid) -->
    <g transform="translate(10, -2) rotate(35 80 34)">
        <line x1="78" y1="38" x2="88" y2="24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="78" cy="38" rx="1.5" ry="3" fill="currentColor" transform="rotate(-35 78 38)"/>
        <!-- Parachute plume -->
        <path d="M84 20 L88 24 L94 21 M87 19 L88 24 L92 19 M88 18 L88 24" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Seed 3 (Small distant seed upper right) -->
    <g transform="translate(6, -6) rotate(10 88 12)">
        <line x1="88" y1="18" x2="94" y2="8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <ellipse cx="88" cy="18" rx="1.2" ry="2.2" fill="currentColor" transform="rotate(-25 88 18)"/>
        <!-- Parachute plume -->
        <path d="M91 5 L94 8 L98 6 M94 4 L94 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </g>
</svg>
