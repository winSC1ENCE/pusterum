# ==============================================================================
# Production stack: Caddy (TLS, rate limits) → app (granian) → PostgreSQL,
# plus a restic backup sidecar. Only Caddy publishes ports.
#
# Files next to this compose file (see config/*.example and docs/ops/runbook.md):
#   .env         app configuration + DOMAIN / ACME_EMAIL for Caddy
#   db.env       POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
#   backup.env   RESTIC_REPOSITORY / RESTIC_PASSWORD / HEALTHCHECK_PING_URL
#   secrets/backup_ssh/   SSH key + config for the SFTP backup target (chmod 600)
# ==============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  restart: always

services:
  caddy:
    <<: *hardening
    build:
      context: docker/caddy
    container_name: atem_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt in .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL fehlt in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    depends_on:
      app:
        condition: service_healthy

  app:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atem_app
    # App logs go to the systemd journal (stable name instead of per-container files), so the
    # fail2ban jail "pusterum-admin" keeps working across rebuilds. `docker compose logs` still works.
    logging:
      driver: journald
      options:
        tag: atem_app
    env_file:
      - .env
    volumes:
      - atem_media_data:/app/storage/uploads
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *hardening
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: atem_postgres
    env_file:
      - db.env
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    shm_size: 128m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    <<: *hardening
    build:
      context: docker/backup
    container_name: atem_backup
    # crond (PID 1) does not reap restic's finished ssh processes; the zombies count towards
    # pids_limit and would eventually stop backups. Docker's init reaps them.
    init: true
    env_file:
      - db.env
      - backup.env
    volumes:
      - atem_media_data:/media:ro
      - restic_cache:/var/cache/restic
      - ./secrets/backup_ssh:/root/.ssh:ro
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy

  # One-off restore (writes media back). Usage – see docs/ops/runbook.md:
  #   docker compose -f docker-compose.prod.yml stop app
  #   docker compose -f docker-compose.prod.yml --profile restore run --rm restore restore.sh latest --yes
  restore:
    profiles: ["restore"]
    init: true
    build:
      context: docker/backup
    env_file:
      - db.env
      - backup.env
    volumes:
      - atem_media_data:/media
      - restic_cache:/var/cache/restic
      - ./secrets/backup_ssh:/root/.ssh:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

# IPv6 on the internal network: with "userland-proxy": false (daemon.json) Docker only forwards
# published ports for an address family the network has. The ULA subnet is allocated automatically;
# DNAT keeps the real client address, which TRUSTED_PROXIES (fc00::/7) relies on.
networks:
  default:
    enable_ipv6: true

volumes:
  postgres_prod_data:
  atem_media_data:
  caddy_data:
  caddy_config:
  restic_cache:
