repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/atem/presentation/static/vendor/  # vendored files keep their checksums
      - id: end-of-file-fixer
        exclude: ^src/atem/presentation/static/vendor/
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks detect --source . -v
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy (type check)
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: bandit (security check)
        entry: uv run bandit -c pyproject.toml -r src
        language: system
        types: [python]
        pass_filenames: false

      - id: deptry
        name: deptry (dependency check)
        entry: uv run deptry .
        language: system
        types: [python]
        pass_filenames: false

      - id: vulture
        name: vulture (dead code check)
        entry: uv run vulture src
        language: system
        types: [python]
        pass_filenames: false
