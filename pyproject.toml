[project]
name = "atem"
version = "1.0.0"
description = "Webapplikation für PUSTERUM – Praxis für Atem- und Körpertherapie (Litestar, PostgreSQL, HTMX, Tailwind, Clean Architecture)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "PUSTERUM", email = "info@pusterum.be" }
]
dependencies = [
    "litestar[jinja,structlog]>=2.14.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "structlog>=24.4.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=50.0.2",
    "python-multipart>=0.0.20",
    "granian>=2.8.4",
    "httpx>=0.28.1",
    "aiosmtplib>=5.1.3",
    "pyotp>=2.9.0",
    "segno>=1.6.1",
    "markupsafe>=3.0.4",
    "pillow>=11.0",
    "altcha>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "vulture>=2.14",
    "deptry>=0.21.2",
    "bandit[toml]>=1.9.4",
    "licensecheck>=2024.3",
    "pre-commit>=4.0.1",
    "aiosqlite>=0.20.0",
    "pytest-playwright>=0.10.0",
    "pip-audit>=2.7",
    "granian[reload]>=2.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ==============================================================================
# LINTER & FORMATTER: RUFF
# ==============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "TRY",    # tryceratops (exception handling)
    "RUF",    # Ruff-specific rules
]
ignore = [
    "PLR0913", # Too many arguments in function definition (DI in controllers)
    "TRY003",  # Avoid specifying long messages outside the exception class
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
    "RUF001",  # String contains ambiguous unicode character (e.g. typographic quotes, dashes)
    "RUF002",  # Docstring contains ambiguous unicode character
    "RUF003",  # Comment contains ambiguous unicode character
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "PLR2004", # Magic value used in comparison
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password assigned
    "S106",    # Possible hardcoded password in function call
    "ARG001",  # Unused fixture arguments
    "ARG002",  # Unused method argument
]

[tool.ruff.lint.isort]
known-first-party = ["atem"]

# ==============================================================================
# TYPE CHECKER: MYPY
# ==============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "aiosmtplib.*",
]
ignore_missing_imports = true

# ==============================================================================
# DEAD CODE CHECKER: VULTURE
# ==============================================================================
[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]
exclude = [".venv", "migrations"]

# ==============================================================================
# DEPENDENCY CHECKER: DEPTRY
# ==============================================================================
[tool.deptry]
extend_exclude = [".venv", "migrations"]
known_first_party = ["atem"]

[tool.deptry.package_module_name_map]
litestar = ["litestar"]
pydantic-settings = ["pydantic_settings"]
argon2-cffi = ["argon2"]
python-multipart = ["multipart"]

[tool.deptry.per_rule_ignores]
DEP002 = ["asyncpg", "granian", "python-multipart", "cryptography", "email-validator", "alembic", "httpx"]
DEP003 = ["atem"]

# ==============================================================================
# SECURITY CHECKER: BANDIT
# ==============================================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
skips = ["B101", "B104"]  # skip assert check and bind all interfaces in container config

# ==============================================================================
# TEST RUNNER: PYTEST & COVERAGE
# ==============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --cov=src/atem --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
source = ["src/atem"]
# SQLAlchemy async runs code after DB awaits inside greenlets – without this, coverage
# silently misses those lines and the reported percentage is meaningless.
concurrency = ["greenlet", "thread"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "src/atem/presentation/templates/*",
    "src/atem/presentation/static/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

# ==============================================================================
# LICENSE CHECK
# ==============================================================================
[tool.licensecheck]
using = "requirements"
ignore_packages = []
