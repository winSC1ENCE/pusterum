<section class="relative pt-32 pb-20 md:pt-44 md:pb-32 overflow-hidden bg-gradient-to-b from-sage-50/60 via-sand-50 to-white">
    <!-- Subtle Background Organic Circles -->
    <div class="absolute top-1/4 -right-20 w-96 h-96 bg-sage-200/40 rounded-full blur-3xl -z-10 pointer-events-none"></div>
    <div class="absolute bottom-10 -left-20 w-80 h-80 bg-sand-200/50 rounded-full blur-3xl -z-10 pointer-events-none"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">

            <!-- Hero Text Content -->
            <div class="lg:col-span-7 space-y-6 text-left">
                <div class="inline-flex items-center space-x-2 px-3 py-1.5 rounded-full bg-sage-100/80 border border-sage-200 text-xs font-semibold text-sage-800 tracking-wide uppercase">
                    <span class="w-2 h-2 rounded-full bg-sage-500 animate-pulse"></span>
                    <span>{{ profile.diploma }}</span>
                </div>

                <h1 class="font-serif text-4xl sm:text-5xl lg:text-6xl font-normal text-slate-900 leading-tight tracking-tight">
                    {{ profile.tagline }}
                </h1>

                <p class="text-lg sm:text-xl text-slate-600 font-light leading-relaxed max-w-2xl">
                    {{ profile.bio }}
                </p>

                <!-- Call to action buttons -->
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center space-y-3 sm:space-y-0 sm:space-x-4 pt-4">
                    <a href="#kontakt" class="inline-flex justify-center items-center px-7 py-3.5 rounded-full text-base font-medium text-white bg-sage-600 hover:bg-sage-700 shadow-md hover:shadow-lg transition-all">
                        Termin vereinbaren
                        <svg class="ml-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </a>
                    <a href="#angebot" class="inline-flex justify-center items-center px-7 py-3.5 rounded-full text-base font-medium text-slate-700 bg-white hover:bg-sand-100 border border-sand-200 shadow-sm transition-all">
                        Angebote ansehen
                    </a>
                </div>

                <!-- Recognition Badges -->
                <div class="pt-8 border-t border-sand-200 flex flex-wrap items-center gap-6 text-xs text-slate-500 font-medium">
                    <span class="inline-flex items-center text-slate-700">
                        <svg class="w-4 h-4 text-sage-600 mr-1.5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                        </svg>
                        EMR anerkannt
                    </span>
                    <span class="inline-flex items-center text-slate-700">
                        <svg class="w-4 h-4 text-sage-600 mr-1.5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                        </svg>
                        ASCA registriert
                    </span>
                    <span class="inline-flex items-center text-slate-700">
                        <svg class="w-4 h-4 text-sage-600 mr-1.5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                        </svg>
                        Zusatzversicherung vergütet
                    </span>
                </div>
            </div>

            <!-- Hero Image & Quote Card -->
            <div class="lg:col-span-5 relative">
                <div class="relative mx-auto max-w-md lg:max-w-none rounded-3xl overflow-hidden shadow-2xl bg-white border border-sand-200">
                    <div class="aspect-[4/5] bg-gradient-to-tr from-sage-200 via-sand-100 to-sage-100 flex items-center justify-center p-8 text-center relative">
                        <!-- Calming Abstract Breathing Visual -->
                        <div class="w-48 h-48 rounded-full border-4 border-sage-400/40 animate-ping absolute"></div>
                        <div class="w-36 h-36 rounded-full bg-sage-500/20 backdrop-blur-sm flex items-center justify-center text-sage-800 font-serif italic text-lg z-10 p-4 text-center">
                            Atem & Raum
                        </div>
                    </div>
                </div>

                <!-- Floating Quote Card -->
                <div class="absolute -bottom-6 -left-6 sm:-left-10 bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-xl border border-sand-200 max-w-xs sm:max-w-sm">
                    <p class="font-serif italic text-slate-700 text-sm sm:text-base leading-snug">
                        "{{ profile.quote }}"
                    </p>
                    <div class="mt-3 text-xs font-semibold text-sage-700">
                        {{ profile.full_name }}
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
