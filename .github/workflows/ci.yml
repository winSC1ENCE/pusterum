name: CI / Quality & Security Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  code-quality:
    name: Lint, Format, Types & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: "0.5.8"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Ruff Linter Check
        run: uv run ruff check src tests

      - name: Ruff Formatter Check
        run: uv run ruff format --check src tests

      - name: Mypy Strict Type Check
        run: uv run mypy src

      - name: Bandit Security Analysis
        run: uv run bandit -c pyproject.toml -r src

      - name: Deptry Dependency Check
        run: uv run deptry .

      - name: Vulture Dead Code Analysis
        run: uv run vulture src

  tests:
    name: Pytest & Coverage
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Pytest with Coverage
        run: uv run pytest --cov=src/atem --cov-report=xml --cov-report=term-missing

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: atem:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
