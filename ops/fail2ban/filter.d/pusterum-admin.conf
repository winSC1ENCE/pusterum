# fail2ban filter: failed admin logins logged by the app (JSON inside Docker's json-file log)
#   {"log":"{\"ip\": \"203.0.113.7\", \"event\": \"login_failed\", ...}\n", ...}
[Definition]
failregex = ^(?=.*\\"event\\": \\"login_failed\\").*\\"ip\\": \\"<HOST>\\"
ignoreregex =
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
