{% extends "layouts/base.html" %}

{% block title %}Praxis-Login | PUSTERUM Administration{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-24 px-4 sm:px-6 lg:px-8 bg-theme-main transition-colors duration-300">
    <div class="max-w-md w-full space-y-8 bg-theme-card p-8 sm:p-10 rounded-3xl border border-theme shadow-xl">
        <div class="text-center">
            <div class="w-12 h-12 rounded-full bg-theme-secondary/40 text-theme-primary flex items-center justify-center mx-auto mb-4 border border-theme">
                <svg class="w-6 h-6" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h2 class="font-heading text-2xl font-bold text-theme-text-main">Praxis Administration</h2>
            <p class="text-xs text-theme-text-muted mt-1">Anmeldung für Inhalts- und Corporate Design Studio</p>
        </div>

        {% if error %}
        <div class="p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/admin/login" class="space-y-6">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-theme-text-main mb-2">Benutzername</label>
                <input type="text" id="username" name="username" required value="{{ username or '' }}"
                       class="w-full px-4 py-3 rounded-xl border border-theme focus:border-theme-primary focus:ring-2 focus:ring-theme-primary/20 text-theme-text-main bg-theme-main text-sm outline-none">
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-theme-text-main mb-2">Passwort</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-3 rounded-xl border border-theme focus:border-theme-primary focus:ring-2 focus:ring-theme-primary/20 text-theme-text-main bg-theme-main text-sm outline-none">
            </div>

            <button type="submit" class="w-full py-3.5 px-4 rounded-full text-white bg-theme-primary hover-bg-theme-primary font-medium shadow-md transition-all">
                Anmelden
            </button>
        </form>
    </div>
</div>
{% endblock %}
