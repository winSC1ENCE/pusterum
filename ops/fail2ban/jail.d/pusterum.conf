# fail2ban jails for the PUSTERUM server (copy to /etc/fail2ban/jail.d/)
[DEFAULT]
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
findtime = 15m

[sshd]
enabled = true
mode = aggressive
maxretry = 4

# Repeated failed admin logins → ban the IP in front of the Docker containers.
# The app container logs to the systemd journal (docker-compose.prod.yml: logging driver journald),
# so the jail also works before the first start and after every rebuild (new container IDs).
# Docker-published ports bypass the INPUT chain, therefore the DOCKER-USER chain is used.
[pusterum-admin]
enabled = true
filter = pusterum-admin
backend = systemd
journalmatch = CONTAINER_NAME=atem_app
maxretry = 8
banaction = iptables-allports[chain="DOCKER-USER"]
