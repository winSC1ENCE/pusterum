title = "Gitleaks Configuration for Atem"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
    '''tests/.*''',
    '''tests_e2e/.*''',
    '''\.env\.example$''',
    '''config/[a-z.]+\.example$''',
]
# Content-block keys (e.g. "competencies.for_whom_1") are dotted identifiers, not secrets.
# Matched against the whole line, so only `"key": "<section>.<name>"` entries are allowlisted.
regexTarget = "line"
regexes = [
    '''^\s*"key":\s*"[a-z][a-z0-9_]*(\.[a-z0-9_]+)+",?\s*$''',
]
