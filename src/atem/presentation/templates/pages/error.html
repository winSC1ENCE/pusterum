{% extends "layouts/base.html" %}

{% block title %}{{ status_code }} | PUSTERUM{% endblock %}

{% block content %}
<section class="min-h-[60vh] flex items-center justify-center py-24 px-4 bg-theme-main">
    <div class="max-w-lg text-center space-y-6">
        <p class="font-heading text-6xl font-bold text-theme-primary">{{ status_code }}</p>
        <h1 class="font-heading text-2xl font-bold text-theme-text-main">{{ message }}</h1>
        <a href="/" class="inline-block px-6 py-3 rounded-full bg-theme-primary text-white hover-bg-theme-primary font-medium">Zur Startseite</a>
    </div>
</section>
{% endblock %}
